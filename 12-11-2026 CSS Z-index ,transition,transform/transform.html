
<!DOCTYPE html>
<html>
<head>
    <title>CSS Transform Practice</title>

    <style>
        .container {
            display: flex;
            gap: 50px;
            flex-wrap: wrap;
            padding: 30px;
        }

        .box {
            width: 100px;
            height: 100px;
            background-color: blue;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s;
        }

        .translate:hover {
            transform: translate(30px, 20px);
        }

        .rotate:hover {
            transform: rotate(45deg);
        }

        .scale:hover {
            transform: scale(1.5);
        }

        .skew:hover {
            transform: skew(20deg);
        }

        .origin:hover {
            transform-origin: top left;
            transform: rotate(45deg);
        }

        .combined:hover {
            transform: translateX(20px) rotate(30deg) scale(1.2);
        }
    </style>
</head>

<body>

    <h1>CSS Transform Examples</h1>
 

    <div class="container">

        <div class="box translate">Translate</div>

        <div class="box rotate">Rotate</div>

        <div class="box scale">Scale</div>

        <div class="box skew">Skew</div>

        <div class="box origin">Origin</div>

        <div class="box combined">Combined</div>

    </div>

</body>
</html>
