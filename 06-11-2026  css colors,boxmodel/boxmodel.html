
<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>
    <link rel="stylesheet" href="boxmodel.css">
</head>
<body>
    <h1>CSS Box Model</h1>

    <!-- Content -->
    <section>
        <h2>1. Content</h2>
        <div class="content-box">
            This is Content
        </div>
    </section>

    <!-- Padding -->
    <section>  
        <h2>2. Padding</h2>
        <div class="padding-box">
            This box has padding
        </div>
    </section>

    <!-- Border -->
    <section>
        <h2>3. Border</h2>
        <div class="border-box">
            This box has border
        </div>
    </section>

    <!-- Margin -->
    <section>
        <h2>4. Margin</h2>
        <div class="margin-box">
            First Box
        </div>

        <div class="margin-box">
            Second Box
        </div>
    </section>

    <!-- Box Sizing -->
    <section>
        <h2>5. Box Sizing</h2>

        <div class="content-sizing">
            Content Box
        </div>

        <div class="border-sizing">
            Border Box
        </div>
    </section>

    <!-- Margin Auto -->
    <section>
        <h2>6. Margin Auto</h2>

        <div class="center-box">
            Centered Box
        </div>
    </section>

    <!-- Margin Collapse -->
    <section>
        <h2>7. Margin Collapse</h2>

        <div class="collapse-one">
            Box One
        </div>

        <div class="collapse-two">
            Box Two
        </div>
    </section>

</body>
</html>
