
<!DOCTYPE html>
<html>
<head>
    <title>CSS Overflow</title>

    <style>
        .box {
            width: 250px;
            height: 120px;
            border: 3px solid steelblue;
            padding: 10px;
            margin: 20px;
            
            /* overflow: auto; */
             /* overflow: hidden; */
             /* overflow: scroll; */
        }
    </style>
</head>
<body>

    <h2>CSS Overflow Example</h2>

    <div class="box">
        CSS overflow controls what happens
        when content is larger than its container.

        Overflow is useful when we have
        large amounts of text, images,
        or other elements inside a fixed-size box.

        This is additional content to demonstrate
        scrolling inside the container.
    </div>

</body>
</html>
